name: Windows-EXE bauen

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: EXE bauen
        run: >
          pyinstaller --noconfirm --onefile --noconsole --name RF4SpotDB
          --icon app.ico
          --add-data "web;web"
          --add-data "app.ico;."
          main.py

      - name: ZIP erstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path paket/RF4SpotDB | Out-Null
          Copy-Item dist/RF4SpotDB.exe paket/RF4SpotDB/
          Compress-Archive -Path paket/RF4SpotDB -DestinationPath RF4SpotDB-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RF4SpotDB-Windows
          path: RF4SpotDB-Windows.zip

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: RF4 Spot-Datenbank v1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Download:** `RF4SpotDB-Windows.zip` herunterladen, entpacken und `RF4SpotDB.exe` starten.
            Deine Spots liegen im Ordner `daten` neben der .exe. Beim Update diesen Ordner in die neue Version kopieren.
          files: RF4SpotDB-Windows.zip
